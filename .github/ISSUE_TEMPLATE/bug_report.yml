name: Bug report
description: Something behaves wrongly — a wrong result, a wrong response, a crash, or a surface that misbehaves.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        This is a single-maintainer hobby project and replies are best-effort.
        A report with the fields below filled in can be acted on; one without
        them usually cannot.

        **Do not report a vulnerability here.** Use the private path described
        in [SECURITY.md](https://github.com/My-Denia/wuwa-translate-bot/blob/main/SECURITY.md).

        **Redact before you paste.** Remove tokens, API keys, device
        credentials, real Telegram ids and `.env` contents from everything you
        include.

        **Public beta reports:** Never paste submitted text or model output if
        it contains personal or sensitive data. Reduce it to a non-sensitive
        example, or describe the behaviour without quoting that content.

  - type: input
    id: version
    attributes:
      label: Version or observation time
      description: For self-hosting, give the release tag or commit. For the public beta Site, give the date and approximate UTC time you observed the problem.
      placeholder: "v0.4.0 / commit 0f48e39, or public beta at 2026-09-06 13:45 UTC"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      description: Where the wrong behaviour appears. Pick the one closest to it.
      options:
        - Public beta Site
        - Telegram bot
        - HTTP API (/v1)
        - Private web presentation layer
        - Windows desktop client
        - Data build (dictionary from upstream game data)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment or browser
      description: For self-hosting, give the operating system, Python version, and installation method. For the public beta Site, give the operating system and browser version.
      placeholder: |
        Public beta: Windows 11, Firefox 142
        Self-hosted: Ubuntu 24.04, Python 3.12.7, source (uv sync --locked --extra dev)
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: In order, small enough for somebody else to follow.
      placeholder: |
        1. Start the API with ...
        2. Send ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What you thought would happen, and why.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead. Include the exact text or response where you can.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and error output
      description: >-
        The part that matters, not the whole file. Include the request id if
        one was shown. Write `none` if there is nothing to attach.
      render: shell
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Configuration that differs from the defaults, a workaround you found, a guess at the cause.
    validations:
      required: false

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: >-
            I have removed Telegram bot tokens, OpenAI-compatible API keys,
            device credentials, real Telegram chat or user ids, `.env`
            contents, and host names, addresses or paths that identify a
            deployment, from everything pasted above.
          required: true
        - label: I searched the open and closed issues and this is not one of them.
          required: true
        - label: This is not a security vulnerability.
          required: true
