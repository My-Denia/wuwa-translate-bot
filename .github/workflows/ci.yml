name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_repo_hygiene.py
      - run: python scripts/check_non_goals.py
      - run: python scripts/check_architecture_boundaries.py
      - run: python scripts/check_api_contract.py
      - run: python -m pytest

  lock:
    name: uv lock drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Pin uv to the same version the deploy images use (deploy/Dockerfile).
      - run: python -m pip install -U pip uv==0.11.3
      - run: uv lock --check

  package:
    name: wheel/sdist build, audit, install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_package_artifacts.py dist/*.whl dist/*.tar.gz
      - name: Install wheel into a clean venv and smoke it
        run: |
          python -m venv "$RUNNER_TEMP/venv-wheel"
          "$RUNNER_TEMP/venv-wheel/bin/pip" install --no-cache-dir dist/*.whl
          "$RUNNER_TEMP/venv-wheel/bin/python" -c "import wuwaterm"
          "$RUNNER_TEMP/venv-wheel/bin/python" -c "import wuwaterm_api"
          "$RUNNER_TEMP/venv-wheel/bin/wuwaterm" --help
          "$RUNNER_TEMP/venv-wheel/bin/wuwaterm-api" --help
      - name: Install sdist into a clean venv and smoke it
        run: |
          python -m venv "$RUNNER_TEMP/venv-sdist"
          "$RUNNER_TEMP/venv-sdist/bin/pip" install --no-cache-dir dist/*.tar.gz
          "$RUNNER_TEMP/venv-sdist/bin/python" -c "import wuwaterm"
          "$RUNNER_TEMP/venv-sdist/bin/python" -c "import wuwaterm_api"
          "$RUNNER_TEMP/venv-sdist/bin/wuwaterm" --help
          "$RUNNER_TEMP/venv-sdist/bin/wuwaterm-api" --help

  deploy-boundary:
    name: docker runtime/builder boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Syntax-check deploy shell scripts
        run: |
          for f in deploy/*.sh; do sh -n "$f"; done
      - name: Validate compose config with placeholder env
        run: |
          cp .env.example .env
          docker compose -f deploy/docker-compose.yml config -q
          rm .env
      - run: docker build -f deploy/Dockerfile --target runtime -t wuwaterm-runtime:ci .
      - run: docker build -f deploy/Dockerfile --target builder -t wuwaterm-builder:ci .
      - name: Runtime image refuses non-bot commands
        run: |
          status=0
          docker run --rm wuwaterm-runtime:ci build-db || status=$?
          test "$status" -eq 64
      - name: Runtime image excludes builder tooling; builder retains git
        run: |
          docker run --rm --entrypoint sh wuwaterm-runtime:ci -c '! command -v git && ! command -v uv && ! command -v uvx'
          docker run --rm --entrypoint sh wuwaterm-builder:ci -c 'command -v git >/dev/null'
