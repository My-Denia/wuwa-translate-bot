name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor is requires-python >=3.11 with no upper bound, so
        # the versions above the floor are tested rather than assumed. A red
        # one is removed from this list with the reason recorded, never hidden
        # behind an upper bound the package does not need.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      # One entry point, and it is the same one a contributor is told to run:
      # hygiene, non-goals, architecture, API contract, ruff, then the suite.
      # Listing the gates here as separate steps is what let CI and the
      # documentation drift apart; the list lives in scripts/validate.py now.
      - run: python scripts/validate.py

  lock:
    name: uv lock drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Pin uv to the same version the deploy images use (deploy/Dockerfile).
      - run: python -m pip install -U pip uv==0.11.3
      - run: uv lock --check

  package:
    name: wheel/sdist build, audit, install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_package_artifacts.py dist/*.whl dist/*.tar.gz
      - name: Install wheel into a clean venv and smoke it
        run: |
          python -m venv "$RUNNER_TEMP/venv-wheel"
          "$RUNNER_TEMP/venv-wheel/bin/pip" install --no-cache-dir dist/*.whl
          "$RUNNER_TEMP/venv-wheel/bin/python" -c "import wuwaterm"
          "$RUNNER_TEMP/venv-wheel/bin/python" -c "import wuwaterm_api"
          "$RUNNER_TEMP/venv-wheel/bin/wuwaterm" --help
          "$RUNNER_TEMP/venv-wheel/bin/wuwaterm-api" --help
      - name: Install sdist into a clean venv and smoke it
        run: |
          python -m venv "$RUNNER_TEMP/venv-sdist"
          "$RUNNER_TEMP/venv-sdist/bin/pip" install --no-cache-dir dist/*.tar.gz
          "$RUNNER_TEMP/venv-sdist/bin/python" -c "import wuwaterm"
          "$RUNNER_TEMP/venv-sdist/bin/python" -c "import wuwaterm_api"
          "$RUNNER_TEMP/venv-sdist/bin/wuwaterm" --help
          "$RUNNER_TEMP/venv-sdist/bin/wuwaterm-api" --help

  client:
    name: desktop client build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # build.ps1 deliberately refuses to fall back to a system interpreter,
      # so CI creates the same client-local virtual environment an operator
      # would, and builds through the same script.
      - run: python -m venv client/.venv
      - run: client/.venv/Scripts/python.exe -m pip install -U pip
      - run: client/.venv/Scripts/python.exe -m pip install -e "client[dev,build]"
      - name: Client test suite
        working-directory: client
        run: .venv/Scripts/python.exe -m pytest
      - name: One-folder PyInstaller build
        run: powershell -NoProfile -ExecutionPolicy Bypass -File client/build.ps1
      - name: The build output must stay out of the working tree
        shell: bash
        run: |
          dirt="$(git status --porcelain)"
          if [ -n "$dirt" ]; then
            echo "a build left files the ignore rules do not cover:" >&2
            echo "$dirt" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: WuwaTerm-windows
          path: client/dist/WuwaTerm/
          if-no-files-found: error

  deploy-boundary:
    name: docker runtime/builder boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Syntax-check deploy shell scripts
        run: |
          for f in deploy/*.sh; do sh -n "$f"; done
      - name: Validate compose config with placeholder env
        run: |
          cp .env.example .env
          docker compose -f deploy/docker-compose.yml config -q
          rm .env
      - run: docker build -f deploy/Dockerfile --target runtime -t wuwaterm-runtime:ci .
      - run: docker build -f deploy/Dockerfile --target builder -t wuwaterm-builder:ci .
      - name: Runtime image refuses data-build commands
        run: |
          for forbidden in build-db refresh-data verify-db; do
            status=0
            docker run --rm wuwaterm-runtime:ci "$forbidden" || status=$?
            test "$status" -eq 64
          done
      - name: Runtime image serves both inbound surfaces
        run: |
          docker run --rm --entrypoint sh wuwaterm-runtime:ci -c 'python -c "import wuwaterm.bot, wuwaterm_api.app"'
          docker run --rm wuwaterm-runtime:ci api --help >/dev/null
          docker run --rm wuwaterm-runtime:ci device list >/dev/null
      - name: Runtime image excludes builder tooling; builder retains git
        run: |
          docker run --rm --entrypoint sh wuwaterm-runtime:ci -c '! command -v git && ! command -v uv && ! command -v uvx'
          docker run --rm --entrypoint sh wuwaterm-builder:ci -c 'command -v git >/dev/null'
