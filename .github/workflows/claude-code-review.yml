name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Dependabot's version-bump pull requests are not reviewed here: the action
    # refuses any workflow "initiated by non-human actor" that is not in
    # allowed_bots, so every dependency bump showed a failed check while the
    # real gates (CI matrix, lock drift, packaging) had already passed. Those
    # bumps are mechanical; CI is the review. Skipping the job keeps the check
    # green-by-absence instead of red-by-policy. Other bots still need the
    # explicit allowed_bots entry below.
    if: github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Allow Cursor cloud-agent pull requests to be reviewed; without this
          # the action aborts with "Workflow initiated by non-human actor:
          # cursor" on any PR opened or synchronized by that bot. Scoped to the
          # specific bot actor rather than '*' so third-party GitHub Apps cannot
          # trigger the action. The action strips the "[bot]" suffix and matches
          # case-insensitively, so this also covers the bare "cursor" actor.
          allowed_bots: 'cursor[bot]'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--model claude-opus-5'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
