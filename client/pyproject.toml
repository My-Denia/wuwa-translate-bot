[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wuwaterm-client"
version = "0.2.0"
description = "Owner-only Windows desktop client for the wuwaterm HTTP API. Not published to any package index."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Peter" }]
# Not published: this classifier makes PyPI/Warehouse reject an upload, and
# this package is never added to the wuwaterm server wheel (it has its own
# pyproject.toml here in client/, outside src/).
classifiers = [
  "Private :: Do Not Upload",
]
dependencies = [
  "PySide6>=6.7,<7",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "qasync>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]
build = [
  "pyinstaller>=6.10,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-config --strict-markers"
