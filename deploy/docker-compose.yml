services:
  wuwaterm:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    image: ${WUWATERM_RUNTIME_IMAGE:-wuwaterm-runtime:local}
    container_name: wuwaterm-bot
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      WUWATERM_DB_PATH: /app/data/terms.db
      WUWATERM_STATE_DIR: /app/state
      WUWATERM_SETTINGS_PATH: /app/state/chat_settings.json
      WUWATERM_CHANNEL_REPLY_INDEX_PATH: /app/state/channel_replies.json
    volumes:
      - ../data:/app/data:ro
      - ../state:/app/state
    command: ["bot"]

  # Same image, same read-only terminology database, separate process and
  # separate writable state. It binds loopback only, so the host gains no new
  # public surface; the owner desktop reaches it through the existing SSH
  # entry point.
  wuwaterm-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    image: ${WUWATERM_RUNTIME_IMAGE:-wuwaterm-runtime:local}
    container_name: wuwaterm-api
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      WUWATERM_DB_PATH: /app/data/terms.db
      WUWATERM_API_STATE_DIR: /app/state-api
      WUWATERM_API_BIND: ${WUWATERM_API_BIND:-127.0.0.1}
      WUWATERM_API_PORT: ${WUWATERM_API_PORT:-8787}
    volumes:
      - ../data:/app/data:ro
      - ../state/api:/app/state-api
    command: ["api"]

  wuwaterm-builder:
    profiles: ["builder"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: builder
    image: wuwaterm-builder:local
    network_mode: host
    environment:
      WUWATERM_DB_PATH: /app/data/terms.db
      WUWATERM_DATA_DIR: /app/data/wutheringdata
      WUWATERM_SOURCE_PROFILE: ${WUWATERM_SOURCE_PROFILE:-arikatsu}
    volumes:
      - ../data:/app/data
    command: ["verify-db"]
