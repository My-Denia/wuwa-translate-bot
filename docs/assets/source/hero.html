<!doctype html>
<!--
  WuwaTerm README hero banner. Original artwork for this repository; no game assets.
  Render: Chromium, 1280x400 viewport, device scale factor 2, transparent background.
  Fonts: Inter, Noto Sans SC. Output: docs/assets/readme/hero.png.
  The term pairs shown are real dictionary results (see docs/telegram-behavior.md).
--><html><head><meta charset="utf-8"><style>
:root{--bg:#0b1319;--surface:#111e26;--line:#2a3c45;--text:#edf3ef;--muted:#a1b4b8;--accent:#b1e8c6}
html,body{margin:0;background:transparent}
.banner{position:relative;width:1280px;height:400px;border-radius:24px;overflow:hidden;background:
  radial-gradient(900px 420px at 88% 30%, rgba(177,232,198,.10), transparent 60%),
  radial-gradient(600px 300px at 0% 100%, rgba(80,140,160,.10), transparent 70%), var(--bg);
  font-family:Inter,"Noto Sans SC",sans-serif;color:var(--text);box-sizing:border-box;border:1px solid #1d2c34}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(90deg,transparent,#000 55%,#000)}
.left{position:absolute;left:72px;top:58px;width:700px}
.brand{display:flex;align-items:center;gap:16px}
.brand img{width:64px;height:64px}
.brand b{font-size:40px;letter-spacing:-1.2px;font-weight:700}
h1{margin:30px 0 0;font-size:40px;line-height:1.15;letter-spacing:-1.4px;font-weight:700}
h1 span{color:var(--accent)}
.zh{margin-top:18px;font-size:22px;color:var(--muted);letter-spacing:.5px;font-family:"Noto Sans SC",sans-serif}
.pills{position:absolute;left:72px;bottom:44px;display:flex;gap:10px}
.pill{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:17px;color:var(--muted)}
.pill i{font-style:normal;color:var(--accent)}
.card{position:absolute;right:60px;top:70px;width:392px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 28px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.k{font-size:13px;letter-spacing:2px;color:var(--accent);font-weight:700}
.pair{display:grid;grid-template-columns:1fr 40px 1fr;align-items:center;margin-top:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.pair:last-of-type{border-bottom:0}
.pair .z{font-family:"Noto Sans SC";font-size:30px;font-weight:700}
.pair .a{font-size:18px;color:var(--muted);text-align:center}
.pair .e{font-size:28px;font-weight:600;color:var(--accent);text-align:right}
.foot{margin-top:6px;font-size:15px;color:var(--muted);line-height:1.4}
</style></head><body><div class="banner"><div class="grid"></div>
<div class="left">
 <div class="brand"><img src="../logo.svg"><b>WuwaTerm</b></div>
 <h1>Get Wuthering Waves terms right,<br><span>in Chinese and English.</span></h1>
 <div class="zh">查询《鸣潮》中英官方译名 · 保留译名的整句翻译 · 核对已有译文</div>
</div>
<div class="pills"><span class="pill"><i>●</i> Dictionary-first</span><span class="pill">Term-locked translation</span><span class="pill">Translation review</span></div>
<div class="card"><div class="k">OFFICIAL TERM PAIRS</div>
 <div class="pair"><span class="z">声骸</span><span class="a">⇄</span><span class="e">Echo</span></div>
 <div class="pair"><span class="z">今汐</span><span class="a">⇄</span><span class="e">Jinhsi</span></div>
 <div class="foot">Real dictionary results, returned byte for byte.</div>
</div>
</div></body></html>
