<!doctype html>
<!--
  WuwaTerm GitHub social preview. Original artwork for this repository; no game assets.
  Render: Chromium, 1280x640 viewport, device scale factor 1, opaque background.
  Fonts: Inter, Noto Sans SC. Output: docs/assets/social-preview.png.
  GitHub only accepts this image through Settings > Social preview; it is not set by any file in the repository.
-->
<html><head><meta charset="utf-8"><style>
:root{--bg:#0b1319;--surface:#111e26;--line:#2a3c45;--text:#edf3ef;--muted:#a1b4b8;--accent:#b1e8c6}
html,body{margin:0}
.c{position:relative;width:1280px;height:640px;overflow:hidden;background:radial-gradient(900px 500px at 85% 20%,rgba(177,232,198,.11),transparent 60%),var(--bg);font-family:Inter,"Noto Sans SC",sans-serif;color:var(--text)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px}
.brand{position:absolute;left:88px;top:92px;display:flex;align-items:center;gap:20px}
.brand img{width:84px;height:84px}.brand b{font-size:52px;letter-spacing:-1.6px}
h1{position:absolute;left:88px;top:236px;margin:0;font-size:58px;line-height:1.12;letter-spacing:-1.8px;width:1100px}
h1 span{color:var(--accent)}
.zh{position:absolute;left:88px;top:408px;font-size:30px;color:var(--muted);font-family:"Noto Sans SC",sans-serif;letter-spacing:.5px}
.foot{position:absolute;left:88px;bottom:70px;display:flex;gap:12px}
.pill{border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:19px;color:var(--muted);background:rgba(11,19,25,.6)}
.pair{position:absolute;right:88px;top:108px;display:flex;align-items:center;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 24px}
.pair .z{font-family:"Noto Sans SC";font-size:32px;font-weight:700}.pair .a{color:var(--muted);font-size:22px}.pair .e{font-size:30px;font-weight:600;color:var(--accent)}
</style></head><body><div class="c"><div class="grid"></div>
<div class="brand"><img src="../logo.svg" alt=""><b>WuwaTerm</b></div>
<div class="pair"><span class="z">声骸</span><span class="a">⇄</span><span class="e">Echo</span></div>
<h1>Get Wuthering Waves terms right,<br><span>in Chinese and English.</span></h1>
<div class="zh">查询《鸣潮》中英官方译名 · 保留译名的整句翻译 · 核对已有译文</div>
<div class="foot"><span class="pill">Dictionary-first</span><span class="pill">Term-locked translation</span><span class="pill">Unofficial · Open source</span></div>
</div></body></html>
