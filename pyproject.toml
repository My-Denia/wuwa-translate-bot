[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wuwaterm"
version = "0.2.1"
description = "Dictionary-first Telegram bot for Wuthering Waves Chinese terms to official English localization."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Peter" }]
dependencies = [
  "httpx>=0.27,<1",
  "python-telegram-bot>=22.7,<23",
]

[project.optional-dependencies]
build = [
  "pypinyin>=0.54,<1",
]
# HTTP adapter. Kept out of the core dependency set so the Telegram runtime
# still installs with httpx + python-telegram-bot only.
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
dev = [
  "pypinyin>=0.54,<1",
  "pytest>=8.0,<9",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
wuwaterm = "wuwaterm.cli:main"
wuwaterm-api = "wuwaterm_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-config --strict-markers"
