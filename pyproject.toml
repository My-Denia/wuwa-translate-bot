[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wuwaterm"
version = "0.1.0"
description = "Dictionary-first Telegram bot for Wuthering Waves Chinese terms to official English localization."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Peter" }]
dependencies = [
  "httpx>=0.27,<1",
  "pypinyin>=0.54,<1",
  "python-telegram-bot>=22.7,<23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[project.scripts]
wuwaterm = "wuwaterm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-config --strict-markers"
